aid: saffron-finance
name: Saffron Finance
description: 'Saffron Finance is a decentralized peer-to-peer interest-rate risk adjustment
  protocol built on Ethereum. Underlying DeFi yield is transformed by a smart-contract
  vault system according to each user''s indicated risk preference, splitting deposits
  into senior (fixed-income, risk-averse) and junior (variable, risk-seeking) tranches
  across Uniswap V3 fixed-income vaults. The protocol is governed by the Saffron DAO
  and its SFI token, and was surfaced in the API Evangelist network as a portfolio
  company of Multicoin Capital in the crypto-web3 sector. Saffron is an on-chain
  protocol rather than a hosted web-API provider: its developer surface is Solidity
  smart contracts, published documentation, audits, and whitepapers rather than a
  REST/HTTP API.'
